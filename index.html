<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matkamuistio & Pakkauslista</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <!-- Header & Language toggle -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center">
        <h1 id="appTitle" class="text-xl font-semibold text-indigo-600">Matkamuistio</h1>
        <button onclick="toggleLang()" id="langBtn" class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-sm font-medium">EN / FI</button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-6">
        <!-- AI Chat Bubble / Assistant & Relaxation Section -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-indigo-100">
            <div class="flex items-center space-x-2 mb-2">
                <span class="text-xl">🤖</span>
                <h2 id="aiHeader" class="font-medium text-gray-700">Tekoälyavustin & Rauhoittuminen</h2>
            </div>
            <div id="aiResponse" class="bg-indigo-50 p-3 rounded-xl text-sm text-indigo-900 mb-3">
                Hei! Ota aivan rauhassa. Jutellaanko matkasta, pikalatauksen varrella olevista erikoisista paikoista tai kaivataanko pientä tsemppiä?
            </div>
            <div class="flex gap-2">
                <input type="text" id="aiInput" placeholder="Kirjoita tai kysy tekoälyltä..." class="flex-1 border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <button onclick="handleAIPrompt()" id="sendBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700">Lähetä</button>
            </div>
        </section>

        <!-- Navigation Buttons for Lists -->
        <section class="grid grid-cols-2 gap-3">
            <button onclick="showSection('trips')" class="p-4 bg-white rounded-2xl shadow-sm border border-gray-100 text-left hover:border-indigo-300 transition">
                <span class="text-2xl block mb-1">🚗</span>
                <span id="navTrips" class="font-medium text-gray-800">Matkatyypit</span>
            </button>
            <button onclick="showSection('packing')" class="p-4 bg-white rounded-2xl shadow-sm border border-gray-100 text-left hover:border-indigo-300 transition">
                <span class="text-2xl block mb-1">🎒</span>
                <span id="navPacking" class="font-medium text-gray-800">Pakkauslista</span>
            </button>
            <button onclick="showSection('shopping')" class="p-4 bg-white rounded-2xl shadow-sm border border-gray-100 text-left hover:border-indigo-300 transition">
                <span class="text-2xl block mb-1">🛒</span>
                <span id="navShopping" class="font-medium text-gray-800">Ostoslista</span>
            </button>
            <button onclick="showSection('airbnb')" class="p-4 bg-white rounded-2xl shadow-sm border border-gray-100 text-left hover:border-indigo-300 transition">
                <span class="text-2xl block mb-1">🏡</span>
                <span id="navAirbnb" class="font-medium text-gray-800">Airbnb & Kohde</span>
            </button>
        </section>

        <!-- Dynamic Section Views -->
        <div id="contentSection" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 hidden">
            <div class="flex justify-between items-center mb-3">
                <h3 id="sectionTitle" class="font-semibold text-gray-800">Otsikko</h3>
                <button onclick="closeSection()" id="closeBtn" class="text-gray-400 hover:text-gray-600 text-sm">Sulje X</button>
            </div>
            <div id="sectionBody" class="space-y-2">
                <!-- Dynamic content inserted via JS -->
            </div>
        </div>
    </main>

    <script>
        let currentLang = 'fi';
        let currentActiveSection = null;
        
        const translations = {
            fi: {
                title: "Matkamuistio",
                aiHeader: "Tekoälyavustin & Rauhoittuminen",
                aiPlaceholder: "Kirjoita tai kysy tekoälyltä...",
                send: "Lähetä",
                close: "Sulje X",
                navTrips: "Matkatyypit",
                navPacking: "Pakkauslista",
                navShopping: "Ostoslista",
                navAirbnb: "Airbnb & Kohde",
                tripsTitle: "Matkatyypit",
                packingTitle: "Pakkauslista & Pelillistäminen",
                shoppingTitle: "Ostoslista",
                airbnbTitle: "Airbnb & Erikoiset kohteet",
                aiWelcome: "Hei! Ota aivan rauhassa. Jutellaanko matkasta, pikalatauksen varrella olevista erikoisista paikoista tai kaivataanko pientä tsemppiä?"
            },
            en: {
                title: "Travel Memo",
                aiHeader: "AI Assistant & Relaxation",
                aiPlaceholder: "Type or ask AI...",
                send: "Send",
                close: "Close X",
                navTrips: "Trip Types",
                navPacking: "Packing List",
                navShopping: "Shopping List",
                navAirbnb: "Airbnb & Destination",
                tripsTitle: "Trip Types",
                packingTitle: "Packing List & Progress",
                shoppingTitle: "Shopping List",
                airbnbTitle: "Airbnb & Unique Spots",
                aiWelcome: "Hi! Take it easy. Want to chat about the trip, unique stops near EV chargers, or just relax?"
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'fi' ? 'en' : 'fi';
            updateTexts();
            if(currentActiveSection) {
                showSection(currentActiveSection);
            }
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('appTitle').innerText = t.title;
            document.getElementById('aiHeader').innerText = t.aiHeader;
            document.getElementById('aiInput').placeholder = t.aiPlaceholder;
            document.getElementById('sendBtn').innerText = t.send;
            document.getElementById('closeBtn').innerText = t.close;
            document.getElementById('navTrips').innerText = t.navTrips;
            document.getElementById('navPacking').innerText = t.navPacking;
            document.getElementById('navShopping').innerText = t.navShopping;
            document.getElementById('navAirbnb').innerText = t.navAirbnb;
            
            const resp = document.getElementById('aiResponse');
            if(resp.dataset.default === "true" || !resp.dataset.default) {
                resp.innerText = t.aiWelcome;
                resp.dataset.default = "true";
            }
        }

        function showSection(type) {
            currentActiveSection = type;
            const section = document.getElementById('contentSection');
            const title = document.getElementById('sectionTitle');
            const body = document.getElementById('sectionBody');
            section.classList.remove('hidden');
            
            const t = translations[currentLang];
            if(type === 'trips') {
                title.innerText = t.tripsTitle;
                body.innerHTML = currentLang === 'fi' ? `
                    <p class="text-sm text-gray-600 mb-2">Valitse matkatyyppi:</p>
                    <button class="w-full text-left p-2 bg-gray-50 rounded hover:bg-indigo-50">Matka sukulaisille</button>
                    <button class="w-full text-left p-2 bg-gray-50 rounded hover:bg-indigo-50">Mökkimatka</button>
                    <button class="w-full text-left p-2 bg-gray-50 rounded hover:bg-indigo-50">Airbnb matkat Suomessa</button>
                    <button class="w-full text-left p-2 bg-gray-50 rounded hover:bg-indigo-50">Hotellimatkat</button>
                ` : `
                    <p class="text-sm text-gray-600 mb-2">Select trip type:</p>
                    <button class="w-full text-left p-2 bg-gray-50 rounded hover:bg-indigo-50">Visit relatives</button>
                    <button class="w-full text-left p-2 bg-gray-50 rounded hover:bg-indigo-50">Cabin Trip</button>
                    <button class="w-full text-left p-2 bg-gray-50 rounded hover:bg-indigo-50">Airbnb trips in Finland</button>
                    <button class="w-full text-left p-2 bg-gray-50 rounded hover:bg-indigo-50">Hotel trips</button>
                `;
            } else if(type === 'packing') {
                title.innerText = t.packingTitle;
                body.innerHTML = currentLang === 'fi' ? `
                    <div class="mb-3 bg-indigo-50 p-2 rounded-lg text-xs text-indigo-800 font-medium">
                        🎮 Pakkauspisteet / Edistyminen: <span id="progressText">0%</span> valmiina
                    </div>
                    <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-1">Pakkaa edellisenä iltana (Jaa vaimolle):</p>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Omat vaatteet omaan kassiin</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Vaihtopaita + muut + 1 / matkapäivä</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Pyjama housut, paita?</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> College housut</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Oma hiusharja</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Hammasharjat, hammastahna</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Lääkkeet</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Cpap laite</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Verenpaine mittari</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Muovinen sähköjako, jatkojohto, phone charger</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Uimahousut</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Lakanat & Pyyhkeet</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Kenkiä: Crocs?, saappaat?</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Frisbeegolf housut, shortsit, kengät</label>
                ` : `
                    <div class="mb-3 bg-indigo-50 p-2 rounded-lg text-xs text-indigo-800 font-medium">
                        🎮 Packing Progress: <span id="progressText">0%</span> completed
                    </div>
                    <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-1">Pack the night before:</p>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Pack own clothes in own bag</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Change shirt + others + 1 / travel day</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Pajamas & Sweatpants</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Hairbrush & Toothbrushes</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Medications & CPAP device</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Blood pressure monitor</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Power strip & charger</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Swimwear, linens & towels</label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="pack-chk rounded" onchange="updateProgress()"> Shoes & Disc golf gear</label>
                `;
            } else if(type === 'shopping') {
                title.innerText = t.shoppingTitle;
                body.innerHTML = currentLang === 'fi' ? `
                    <div class="space-y-2">
                        <input type="text" placeholder="Lisää ostos..." class="w-full border rounded p-2 text-sm">
                        <div class="text-sm bg-gray-50 p-2 rounded">🛒 Retki kahvilusikka ja kahvikuppi</div>
                        <div class="text-sm bg-gray-50 p-2 rounded">🛒 Lyhyt jatkojohto</div>
                    </div>
                ` : `
                    <div class="space-y-2">
                        <input type="text" placeholder="Add shopping item..." class="w-full border rounded p-2 text-sm">
                        <div class="text-sm bg-gray-50 p-2 rounded">🛒 Camp coffee spoon and cup</div>
                        <div class="text-sm bg-gray-50 p-2 rounded">🛒 Short extension cord</div>
                    </div>
                `;
            } else if(type === 'airbnb') {
                title.innerText = t.airbnbTitle;
                body.innerHTML = currentLang === 'fi' ? `
                    <div class="space-y-2 text-sm">
                        <p class="text-gray-600">Tallenna Airbnb-kohteita, kuvia ja erikoisia löytöjä:</p>
                        <input type="text" placeholder="Kohteen nimi tai linkki..." class="w-full border rounded p-2">
                        <input type="text" placeholder="Erikoispaikka tai kahvilavinkki matkan varrelta..." class="w-full border rounded p-2">
                        <button class="bg-green-600 text-white w-full py-2 rounded text-sm font-medium">Jaa WhatsAppilla vaimolle</button>
                    </div>
                ` : `
                    <div class="space-y-2 text-sm">
                        <p class="text-gray-600">Save Airbnb places, photos and unique spots:</p>
                        <input type="text" placeholder="Place name or link..." class="w-full border rounded p-2">
                        <input type="text" placeholder="Unique spot or cafe along the way..." class="w-full border rounded p-2">
                        <button class="bg-green-600 text-white w-full py-2 rounded text-sm font-medium">Share via WhatsApp</button>
                    </div>
                `;
            }
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('.pack-chk');
            const checked = document.querySelectorAll('.pack-chk:checked');
            const percent = checkboxes.length ? Math.round((checked.length / checkboxes.length) * 100) : 0;
            const progText = document.getElementById('progressText');
            if(progText) {
                progText.innerText = percent + "%";
            }
        }

        function closeSection() {
            currentActiveSection = null;
            document.getElementById('contentSection').classList.add('hidden');
        }

        function handleAIPrompt() {
            const input = document.getElementById('aiInput');
            const responseDiv = document.getElementById('aiResponse');
            responseDiv.dataset.default = "false";
            const val = input.value.trim().toLowerCase();
            
            if(!val) return;

            if (currentLang === 'fi') {
                if(val.includes('stressi') || val.includes('väsy') || val.includes('rauha')) {
                    responseDiv.innerText = "Hengitä syvään ja ota aivan rauhassa. Olet tehnyt upeasti töitä matkan eteen, ja kaikki on huomenna valmista ilman mitään kiirettä.";
                } else if(val.includes('huomenna') || val.includes('matka')) {
                    responseDiv.innerText = "Miten jännää ja ihanaa, että huomenna päästään matkalle! ✨ Kaikki on hanskassa.";
                } else if(val.includes('lataus') || val.includes('sähköauto') || val.includes('kahvila')) {
                    responseDiv.innerText = "Sähköauton pikalatauksen lähellä on tunnelmallinen paikallinen puoti ja erikoinen kahvila kymmenen minuutin päässä!";
                } else {
                    responseDiv.innerText = "Tallensin muistiin: '" + input.value + "'. Haluatko lisätä tämän listalle tai tutkia kohdevinkkejä?";
                }
            } else {
                if(val.includes('stress') || val.includes('tired') || val.includes('relax')) {
                    responseDiv.innerText = "Take a deep breath and relax. You've prepared wonderfully, and everything is ready for tomorrow without any rush.";
                } else if(val.includes('tomorrow') || val.includes('trip')) {
                    responseDiv.innerText = "How exciting and wonderful that we are heading on a trip tomorrow! ✨";
                } else if(val.includes('charge') || val.includes('ev') || val.includes('cafe')) {
                    responseDiv.innerText = "Near the EV fast charger, there is a cozy local shop and a unique café just 10 minutes away!";
                } else {
                    responseDiv.innerText = "Saved to memory: '" + input.value + "'. Would you like to add this to the list?";
                }
            }
            input.value = '';
        }
    </script>
</body>
</html>
